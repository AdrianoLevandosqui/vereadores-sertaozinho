# Atualiza os dados da Câmara e publica o site, duas vezes por dia.
# Se a conferência com os relatórios oficiais encontrar qualquer divergência, o site NÃO é publicado
# (fica no ar a versão anterior) e o GitHub avisa por e-mail que a execução falhou.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "30 8 * * *"    # 05:30 em Brasília (fora do horário de sessões)
    - cron: "0 18 * * *"    # 15:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Recuperar documentos já baixados
        uses: actions/cache/restore@v4
        with:
          path: dados/brutos
          key: brutos-${{ github.run_id }}
          restore-keys: brutos-

      - name: Coletar dados da Câmara (só o que pode ter mudado)
        working-directory: coleta
        run: python -I coletar.py --atualizar

      - name: Conferir presença com atas e listas assinadas
        working-directory: coleta
        run: python -I conferir_presenca.py

      - name: Gerar o site e conferir os totais com os relatórios oficiais
        working-directory: coleta
        run: |
          python -I gerar_site.py
          cat ../dados/conferencia.txt
          grep -q "Todos os totais conferem" ../dados/conferencia.txt

      - name: Guardar documentos baixados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dados/brutos
          key: brutos-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicar
        uses: actions/deploy-pages@v4
